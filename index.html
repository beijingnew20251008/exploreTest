<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>探索星空</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000010;
            font-family: system-ui, sans-serif;
        }
        /* 星空画布 */
        #starCanvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-size: 48px;
            margin-bottom: 16px;
            text-shadow: 0 0 12px #87cefa;
        }
        p {
            font-size: 18px;
            max-width: 600px;
            color: #cce0ff;
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <canvas id="starCanvas"></canvas>
    <div class="content">
        <h1>探索星空</h1>
        <p>浩瀚银河，星辰流转。仰望这片无尽星海，奔赴宇宙深处，感受星光与时间的浪漫。</p>
    </div>

    <script>
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let stars = [];
        let meteors = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 创建星星
        function createStars(count = 800) {
            stars = [];
            for(let i = 0; i < count; i++){
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    r: Math.random() * 1.2,
                    speed: Math.random() * 0.4,
                    opacity: Math.random()
                })
            }
        }
        createStars();

        // 创建流星
        function createMeteor() {
            meteors.push({
                x: Math.random() * width,
                y: 0,
                len: Math.random() * 80 + 60,
                speedX: Math.random() * 6 + 4,
                speedY: Math.random() * 6 + 4,
                opacity: 1
            })
        }

        function draw() {
            ctx.fillStyle = 'rgba(0,0,16,0.2)';
            ctx.fillRect(0,0,width,height);

            // 绘制星星
            stars.forEach(s => {
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
                ctx.fillStyle = `rgba(255,255,255,${s.opacity})`;
                ctx.fill();
                s.opacity += Math.sin(Date.now() * 0.002 + s.x) * 0.008;
            })

            // 绘制流星
            for(let i = meteors.length -1; i >=0; i--){
                const m = meteors[i];
                ctx.beginPath();
                ctx.moveTo(m.x, m.y);
                ctx.lineTo(m.x - m.len, m.y - m.len);
                ctx.strokeStyle = `rgba(255,255,255,${m.opacity})`;
                ctx.lineWidth = 1.5;
                ctx.stroke();

                m.x += m.speedX;
                m.y += m.speedY;
                m.opacity -= 0.018;
                if(m.opacity <=0 || m.x > width || m.y > height){
                    meteors.splice(i,1);
                }
            }

            // 定时生成流星
            if(Math.random() < 0.006) createMeteor();
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
